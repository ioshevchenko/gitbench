name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        shell: bash
        run: ./gradlew test --no-daemon

      # SWT tests on the desktop of the runner, and the check of the CDT calls against CDT 11.6.0.
      - name: UI tests
        shell: bash
        run: ./gradlew uiTest --no-daemon

      - name: Eclipse for the p2 publisher
        uses: ./.github/actions/eclipse-platform

      - name: Plugin and update site
        shell: bash
        run: ./gradlew updateSite --no-daemon -PeclipseHome="$ECLIPSE_HOME" -PgithubRepository="${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: gitbench
          path: |
            build/libs/gitbench_*.jar
            build/distributions/gitbench-update-site-*.zip
