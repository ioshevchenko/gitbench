name: Release

# A tag such as v0.2.0 builds that version, attaches the plugin and the update site to a GitHub release, and
# publishes the update site on GitHub Pages: https://<owner>.github.io/<repository>/
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Tests
        shell: bash
        run: ./gradlew test uiTest --no-daemon -Pversion="$VERSION"

      - name: Eclipse for the p2 publisher
        uses: ./.github/actions/eclipse-platform

      - name: Plugin and update site
        shell: bash
        run: ./gradlew updateSite --no-daemon -Pversion="$VERSION" -PeclipseHome="$ECLIPSE_HOME" -PgithubRepository="${{ github.repository }}"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/gitbench_*.jar
            build/distributions/gitbench-update-site-*.zip

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/update-site

      - id: pages
        uses: actions/deploy-pages@v4
