plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.1.21'
    id 'com.gradleup.shadow' version '8.3.6'
}

// The folder of an STM32CubeIDE or Eclipse installation, only for deployDropins and a local update site:
// -PcubeIdeHome=... or cubeIdeHome=... in ~/.gradle/gradle.properties.
def cubeIdeHome = findProperty('cubeIdeHome')

// The Eclipse API the plugin compiles against: Eclipse 4.33 (STM32CubeIDE 2.0.0), the oldest supported platform.
// The artifacts of one Eclipse release depend on each other with exact versions, so these few pin the whole set.
def os = org.gradle.internal.os.OperatingSystem.current()
def arch = System.getProperty('os.arch')
def swtFragment = os.windows ? 'org.eclipse.swt.win32.win32.x86_64'
        : os.macOsX ? (arch == 'aarch64' ? 'org.eclipse.swt.cocoa.macosx.aarch64' : 'org.eclipse.swt.cocoa.macosx.x86_64')
        : 'org.eclipse.swt.gtk.linux.x86_64'
def eclipsePlatform = [
    'org.eclipse.platform:org.eclipse.ui.ide:3.22.300',
    'org.eclipse.platform:org.eclipse.ui.editors:3.18.0',
    'org.eclipse.platform:org.eclipse.ui.workbench.texteditor:3.18.0',
    'org.eclipse.platform:org.eclipse.ui.console:3.14.100',
    'org.eclipse.platform:org.eclipse.core.filebuffers:3.8.300',
    "org.eclipse.platform:${swtFragment}:3.127.0",
]

repositories {
    mavenCentral()
    // CDT is not on Maven Central. Its p2 repository serves plugin jars by name; the UI tests check the reflective
    // CDT calls of the plugin against CDT 11.6.0, the CDT of Eclipse 4.33.
    ivy {
        name = 'cdtP2'
        url = 'https://download.eclipse.org/tools/cdt/releases/11.6/cdt-11.6.0/plugins'
        patternLayout { artifact '[module]_[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'cdt.p2' }
    }
}

// org.eclipse.swt names its native fragment through an OSGi property that Maven cannot resolve; the fragment for
// this OS is a direct dependency instead.
configurations.configureEach {
    exclude group: 'org.eclipse.platform', module: 'org.eclipse.swt'
}

dependencies {
    eclipsePlatform.each { compileOnly it }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'it.unimi.dsi:fastutil-core:8.5.15'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    testImplementation 'org.jetbrains:annotations:26.0.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // As in the IntelliJ modules: Kotlin interface methods with a body become Java default methods.
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

// The commit graph is ported from IntelliJ Community as is (Java and Kotlin), with small shims for the platform.
// The text comparison is ported the same way.
def graphDir = 'third_party/intellij-graph'
def diffDir = 'third_party/intellij-diff'
sourceSets {
    main {
        java.srcDirs += ["${graphDir}/src", "${graphDir}/shims", "${diffDir}/src", "${diffDir}/shims"]
        kotlin.srcDirs += ["${graphDir}/src", "${graphDir}/shims", "${diffDir}/src", "${diffDir}/shims"]
    }
    test {
        java.srcDirs += ["${graphDir}/test", "${graphDir}/testShims", "${diffDir}/test", "${diffDir}/testShims"]
        kotlin.srcDirs += ["${graphDir}/test", "${graphDir}/testShims", "${diffDir}/test", "${diffDir}/testShims"]
    }
}

// The plugin version: gradle.properties for local builds, -Pversion=X.Y.Z from the release tag in CI. OSGi and p2
// order builds of one version by the qualifier, the build time in UTC.
def qualifier = new Date().format('yyyyMMddHHmm', TimeZone.getTimeZone('UTC'))
def bundleVersion = "${project.version}.${qualifier}"


tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveFileName = "gitbench_${bundleVersion}.jar"
    from(projectDir) {
        include 'plugin.xml', 'NOTICE', 'LICENSE', 'third_party/LICENSE-APACHE-2.0.txt'
    }
    manifest {
        from('META-INF/MANIFEST.MF') {
            eachEntry { details ->
                if (details.key == 'Bundle-Version') {
                    details.value = bundleVersion
                }
            }
        }
    }
    minimize()
    exclude 'META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/maven/**'
    // Each build has a new name; the old jars would pile up in build/libs.
    doFirst {
        delete fileTree(destinationDirectory) { include 'gitbench_*.jar' }
    }
}

tasks.named('assemble') {
    dependsOn 'shadowJar'
}

test {
    useJUnitPlatform()
    systemProperty 'gitbench.projectDir', projectDir.absolutePath
    systemProperty 'gitbench.graphTestData', file("${graphDir}/testData").absolutePath
    dependsOn 'shadowJar'
}

tasks.register('deployDropins') {
    group = 'gitbench'
    description = 'Copies the plugin jar into the dropins folder of the IDE in cubeIdeHome.'
    dependsOn 'shadowJar'
    doLast {
        if (cubeIdeHome == null) {
            throw new GradleException('Set the IDE folder: -PcubeIdeHome=<folder with plugins and dropins>, or cubeIdeHome=... in ~/.gradle/gradle.properties')
        }
        def dropins = new File(cubeIdeHome, 'dropins')
        dropins.mkdirs()
        dropins.listFiles({ File f -> f.name.startsWith('gitbench_') && f.name.endsWith('.jar') } as FileFilter)?.each { it.delete() }
        copy {
            from tasks.named('shadowJar')
            into dropins
        }
        println "Deployed to ${dropins}"
    }
}

def rasterizeIcons = tasks.register('rasterizeIcons', gitbench.build.RasterizeIconsTask) {
    group = 'gitbench'
    svgDir = layout.projectDirectory.dir('icons/svg')
    pngDir = layout.buildDirectory.dir('generated/icons/png')
}

tasks.named('shadowJar') {
    from(rasterizeIcons) {
        into 'icons/png'
    }
}

tasks.named('test') {
    dependsOn rasterizeIcons
}

// UI tests: real SWT widgets on the desktop, without a running Eclipse. They open windows for a moment, so they run
// apart from "test": ./gradlew uiTest
sourceSets {
    uiTest {
        java.srcDir 'src/uiTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    cdtCheck
    uiTestImplementation.extendsFrom implementation, testImplementation
    uiTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// The UI tests run on unsigned copies of the Eclipse jars; see buildSrc UnsignJar.
def unsigned = Attribute.of('gitbench.unsigned', Boolean)
dependencies {
    attributesSchema { attribute(unsigned) }
    artifactTypes.getByName('jar') { attributes.attribute(unsigned, false) }
    registerTransform(gitbench.build.UnsignJar) {
        from.attribute(unsigned, false)
        to.attribute(unsigned, true)
    }
}
configurations.uiTestRuntimeClasspath { attributes.attribute(unsigned, true) }

dependencies {
    eclipsePlatform.each { uiTestImplementation it }
    cdtCheck 'cdt.p2:org.eclipse.cdt.ui:8.1.500.202405311716@jar'
    cdtCheck 'cdt.p2:org.eclipse.cdt.core:8.4.200.202405291253@jar'
}

tasks.register('uiTest', Test) {
    group = 'verification'
    description = 'Runs the SWT UI tests of the diff and merge windows.'
    testClassesDirs = sourceSets.uiTest.output.classesDirs
    classpath = sourceSets.uiTest.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    systemProperty 'gitbench.iconsDir', layout.buildDirectory.dir('generated/icons/png').get().asFile.absolutePath
    def cdtJars = configurations.cdtCheck
    inputs.files(cdtJars)
    doFirst { systemProperty 'gitbench.cdtJars', cdtJars.asPath }
    dependsOn rasterizeIcons
}

// The p2 update site: Help -> Install New Software in the IDE. The p2 publisher of an Eclipse installation turns the
// plugin and the feature into a repository: -PeclipseHome=<folder>, or the IDE in cubeIdeHome.
def repository = findProperty('githubRepository') ?: 'OWNER/gitbench'

def featureJar = tasks.register('featureJar', Jar) {
    group = 'gitbench'
    description = 'Builds the feature that the update site offers.'
    archiveFileName = "gitbench_${bundleVersion}.jar"
    destinationDirectory = layout.buildDirectory.dir('feature')
    from('site') {
        include 'feature.xml'
        filter { String line -> line.replace('@VERSION@', bundleVersion).replace('@REPOSITORY@', repository) }
    }
    doFirst {
        delete fileTree(destinationDirectory) { include 'gitbench_*.jar' }
    }
}

def siteInput = tasks.register('siteInput', Sync) {
    from(tasks.named('shadowJar')) { into 'plugins' }
    from(featureJar) { into 'features' }
    into layout.buildDirectory.dir('site-input')
}

tasks.register('updateSite') {
    group = 'gitbench'
    description = 'Builds the p2 update site in build/update-site and a zip of it in build/distributions.'
    dependsOn siteInput
    def input = layout.buildDirectory.dir('site-input')
    def output = layout.buildDirectory.dir('update-site')
    outputs.dir(output)
    doLast {
        def eclipseHome = findProperty('eclipseHome') ?: cubeIdeHome
        if (eclipseHome == null) {
            throw new GradleException('Set an Eclipse installation with the p2 publisher: -PeclipseHome=<folder> or -PcubeIdeHome=<folder>')
        }
        def launcher = ['eclipsec.exe', 'stm32cubeidec.exe', 'eclipse'].collect { new File(eclipseHome, it) }.find { it.exists() }
        if (launcher == null) {
            throw new GradleException("No eclipsec.exe, stm32cubeidec.exe or eclipse in ${eclipseHome}")
        }
        def site = output.get().asFile
        delete site
        def siteUri = site.toURI().toString()
        def run = { List<String> arguments ->
            project.exec {
                commandLine([launcher.absolutePath, '-nosplash', '-consoleLog', '-data', '@none'] + arguments)
            }
        }
        run(['-application', 'org.eclipse.equinox.p2.publisher.FeaturesAndBundlesPublisher',
             '-metadataRepository', siteUri, '-artifactRepository', siteUri,
             '-source', input.get().asFile.absolutePath, '-publishArtifacts', '-compress'])
        run(['-application', 'org.eclipse.equinox.p2.publisher.CategoryPublisher',
             '-metadataRepository', siteUri, '-categoryDefinition', file('site/category.xml').toURI().toString(),
             '-categoryQualifier', 'gitbench', '-compress'])
        ant.zip(destfile: layout.buildDirectory.file("distributions/gitbench-update-site-${project.version}.zip").get().asFile,
                basedir: site)
        println "Update site: ${site}"
    }
}
