plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.1.21'
    id 'com.gradleup.shadow' version '8.3.6'
}

def cubeIde = file(property('cubeIdeHome'))
def eclipseBundles = [
    'org.eclipse.swt_*', 'org.eclipse.swt.win32*', 'org.eclipse.jface_*', 'org.eclipse.jface.text_*',
    'org.eclipse.ui_*', 'org.eclipse.ui.workbench_*', 'org.eclipse.ui.ide_*', 'org.eclipse.ui.console_*',
    'org.eclipse.ui.editors_*', 'org.eclipse.ui.workbench.texteditor_*', 'org.eclipse.text_*',
    'org.eclipse.core.runtime_*', 'org.eclipse.core.filesystem_*', 'org.eclipse.core.resources_*', 'org.eclipse.core.jobs_*',
    'org.eclipse.core.commands_*', 'org.eclipse.equinox.common_*', 'org.eclipse.equinox.preferences_*',
    'org.eclipse.equinox.registry_*', 'org.eclipse.osgi_*', 'org.eclipse.core.filebuffers_*', 'org.osgi.service.prefs_*', 'org.eclipse.e4.ui.*'
]

repositories {
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: "${cubeIde}/plugins", includes: eclipseBundles.collect { ["${it}.jar", "${it}/**/*.jar"] }.flatten())
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'it.unimi.dsi:fastutil-core:8.5.15'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    testImplementation 'org.jetbrains:annotations:26.0.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // As in the IntelliJ modules: Kotlin interface methods with a body become Java default methods.
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

// The commit graph is ported from IntelliJ Community as is (Java and Kotlin), with small shims for the platform.
// The text comparison is ported the same way.
def graphDir = 'third_party/intellij-graph'
def diffDir = 'third_party/intellij-diff'
sourceSets {
    main {
        java.srcDirs += ["${graphDir}/src", "${graphDir}/shims", "${diffDir}/src", "${diffDir}/shims"]
        kotlin.srcDirs += ["${graphDir}/src", "${graphDir}/shims", "${diffDir}/src", "${diffDir}/shims"]
    }
    test {
        java.srcDirs += ["${graphDir}/test", "${graphDir}/testShims", "${diffDir}/test", "${diffDir}/testShims"]
        kotlin.srcDirs += ["${graphDir}/test", "${graphDir}/testShims", "${diffDir}/test", "${diffDir}/testShims"]
    }
}

def qualifier = new Date().format('yyyyMMddHHmm')

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveFileName = "gitbench_${project.version}.${qualifier}.jar"
    from(projectDir) {
        include 'plugin.xml', 'NOTICE'
    }
    manifest {
        from('META-INF/MANIFEST.MF') {
            eachEntry { details ->
                if (details.key == 'Bundle-Version') {
                    details.value = details.value.replace('qualifier', qualifier)
                }
            }
        }
    }
    minimize()
    exclude 'META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/maven/**'
}

tasks.named('assemble') {
    dependsOn 'shadowJar'
}

test {
    useJUnitPlatform()
    systemProperty 'gitbench.projectDir', projectDir.absolutePath
    systemProperty 'gitbench.graphTestData', file("${graphDir}/testData").absolutePath
    dependsOn 'shadowJar'
}

tasks.register('deployDropins') {
    group = 'gitbench'
    description = 'Copies the plugin jar into the dropins folder of the configured CubeIDE.'
    dependsOn 'shadowJar'
    doLast {
        def dropins = new File(cubeIde, 'dropins')
        dropins.mkdirs()
        dropins.listFiles({ File f -> f.name.startsWith('gitbench_') && f.name.endsWith('.jar') } as FileFilter)?.each { it.delete() }
        copy {
            from tasks.named('shadowJar')
            into dropins
        }
        println "Deployed to ${dropins}"
    }
}

def rasterizeIcons = tasks.register('rasterizeIcons', gitbench.build.RasterizeIconsTask) {
    group = 'gitbench'
    svgDir = layout.projectDirectory.dir('icons/svg')
    pngDir = layout.buildDirectory.dir('generated/icons/png')
}

tasks.named('shadowJar') {
    from(rasterizeIcons) {
        into 'icons/png'
    }
}

tasks.named('test') {
    dependsOn rasterizeIcons
}
